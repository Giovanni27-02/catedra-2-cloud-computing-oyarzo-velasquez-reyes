server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker: re-resuelve "backend" si cambia de IP (cache 10 s)
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        # Con variable, Nginx resuelve el nombre en cada petición, no solo al arrancar
        set $backend_upstream http://backend:8000;
        # Quita el prefijo /api: /api/items -> /items
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
